<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Plano da Obra · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}
.adminbar{max-width:1320px;margin:0 auto 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.adminbar b{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--p1)}
.adminbar .sp{flex:1}
.adminbar a{color:var(--p1)}
.setup{max-width:640px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:12px}
.setup h1{font-size:28px;margin:0}
.setup ol{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--ink)}
.setup code{font:12.5px var(--f-mono);background:var(--soft);padding:1px 4px;border-radius:3px}
.setup .row{display:flex;gap:8px;flex-wrap:wrap}
.setup input{flex:1 1 260px;min-width:0;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--bg);font:13px var(--f-mono)}
.err{color:var(--today);font-weight:600;margin:0}
.msg{max-width:1320px;margin:40px auto;color:var(--muted)}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"><p class="msg">A carregar…</p></div>
<script>
(function(){
  var REPO='cclx-pt/plano-obramoitabarreiro',FILE='data.json',BRANCH='main';
  var API='https://api.github.com/repos/'+REPO+'/contents/'+FILE;
  var KEY='plano-obra-token';
  var app=document.getElementById('app'),bar=document.getElementById('bar');
  var sha=null,queue=Promise.resolve(),loaded=false;
  function getTok(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function setTok(t){try{t?localStorage.setItem(KEY,t):localStorage.removeItem(KEY)}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function b64enc(str){return btoa(unescape(encodeURIComponent(str)))}
  function b64dec(b){return decodeURIComponent(escape(atob(b.replace(/\n/g,''))))}
  function gh(method,body){
    return fetch(API+(method==='GET'?'?ref='+BRANCH+'&t='+Date.now():''),{method:method,cache:'no-store',
      headers:{'Authorization':'Bearer '+getTok(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
      body:body?JSON.stringify(body):undefined});
  }
  function why(r){
    if(r.status===401)return 'O token não é válido ou expirou. Crie um novo e cole-o abaixo.';
    if(r.status===403||r.status===404)return 'O token não tem acesso ao repositório '+REPO+' (precisa de “Contents: Read and write”).';
    return 'O GitHub respondeu com erro '+r.status+'. Tente outra vez.';
  }
  function setup(err){
    bar.innerHTML='';
    app.innerHTML='<div class="setup"><h1>Plano da Obra · Admin</h1>'+
      (err?'<p class="err">'+esc(err)+'</p>':'')+
      '<p>Para editar e guardar o plano, cole aqui um token do GitHub. Fica guardado só neste navegador.</p>'+
      '<ol><li>Abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com › Fine-grained tokens › Generate new token</a>.</li>'+
      '<li>Em <b>Resource owner</b> escolha <code>cclx-pt</code>.</li>'+
      '<li>Em <b>Repository access</b> escolha <i>Only select repositories</i> › <code>plano-obramoitabarreiro</code>.</li>'+
      '<li>Em <b>Permissions › Repository permissions</b> ponha <b>Contents</b> em <i>Read and write</i>.</li>'+
      '<li>Gere o token, copie-o e cole-o abaixo.</li></ol>'+
      '<div class="row"><input id="tok" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="Token do GitHub"><button class="btn" id="tokSave">Entrar</button></div>'+
      '<p class="hint">A página pública (só leitura) está em <a href="./">'+location.host+location.pathname.replace(/admin\.html$/,'')+'</a>.</p></div>';
    document.getElementById('tokSave').onclick=function(){var v=document.getElementById('tok').value.trim();if(!v)return;setTok(v);load()};
    document.getElementById('tok').onkeydown=function(e){if(e.key==='Enter')document.getElementById('tokSave').click()};
  }
  function drawBar(){
    var t=getTok();
    bar.innerHTML='<div class="adminbar"><b>Modo admin</b><span>As alterações são gravadas no GitHub e aparecem na página pública cerca de 1 minuto depois.</span><span class="sp"></span>'+
      '<button class="btn" id="sync">Sincronizar agora</button><span id="syncmsg" class="save"></span><a href="./" target="_blank" rel="noopener">Ver página pública</a><button class="btn" id="logout">Sair (token …'+esc(t.slice(-4))+')</button></div>';
    document.getElementById('logout').onclick=function(){setTok('');location.reload()};
    document.getElementById('sync').onclick=syncNow;
  }
  function fetchData(){
    return gh('GET').then(function(r){if(!r.ok)throw {setup:why(r)};return r.json()})
      .then(function(j){sha=j.sha;return JSON.parse(b64dec(j.content))});
  }
  function save(S){
    var job=queue.then(function(){
      S.updatedAt=new Date().toISOString().replace(/\.\d+Z$/,'Z');
      return gh('PUT',{message:'Atualização do plano (admin)',content:b64enc(JSON.stringify(S,null,1)+'\n'),sha:sha,branch:BRANCH});
    }).then(function(r){
      if(r.ok)return r.json().then(function(j){sha=j.content.sha;return 'Guardado no GitHub'});
      if(r.status===409||r.status===422)return fetchData().then(function(d){window.PLANO.rerender(d);
        throw new Error('Outra alteração foi gravada entretanto. O plano foi recarregado; repita a sua última alteração.')});
      throw new Error(why(r));
    });
    queue=job.catch(function(){});
    return job;
  }
  // Grava já o que estiver pendente e recarrega a versão mais recente do GitHub.
  function syncNow(){
    var b=document.getElementById('sync'),m=document.getElementById('syncmsg');
    if(!window.PLANO||!window.PLANO.flush)return;
    b.disabled=true;m.textContent='A sincronizar…';
    window.PLANO.flush()
      .then(function(){return queue})
      .then(fetchData)
      .then(function(d){window.PLANO.rerender(d);window.PLANO.status('Sincronizado com o GitHub');
        m.textContent='Sincronizado às '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})})
      .catch(function(e){m.textContent=e&&e.message?e.message:(e&&e.setup?e.setup:'Não foi possível sincronizar. Tente outra vez.')})
      .then(function(){b.disabled=false});
  }
  window.addEventListener('beforeunload',function(e){if(window.PLANO&&window.PLANO.pending&&window.PLANO.pending()){e.preventDefault();e.returnValue=''}});
  function load(){
    if(!getTok()){setup();return}
    app.innerHTML='<p class="msg">A carregar do GitHub…</p>';
    fetchData().then(function(d){
      drawBar();
      if(loaded){window.PLANO.rerender(d);return}
      window.PLANO={readOnly:false,message:'As alterações são gravadas no GitHub automaticamente.',data:d,save:save};
      var s=document.createElement('script');s.src='app.js?t='+Date.now();document.body.appendChild(s);loaded=true;
    },function(e){setup(e&&e.setup?e.setup:'Não foi possível ligar ao GitHub. Verifique a ligação e tente outra vez.')});
  }
  load();
})();
</script>
</body>
</html>
