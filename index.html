<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plano da Obra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}
/* Página pública: só leitura */
.btn.add,.btn.del,.g-add,.hint{display:none!important}
.st{pointer-events:none}
.in:disabled,.gd:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);cursor:default;border-color:transparent}
.gd::-webkit-calendar-picker-indicator,.in::-webkit-calendar-picker-indicator{display:none}
.ro{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;color:var(--muted)}
.ro b{color:var(--ink)}
.msg{max-width:1320px;margin:40px auto;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><p class="msg">A carregar o plano…</p></div>
<script>
(function(){
  var app=document.getElementById('app');
  function when(iso){try{return new Date(iso).toLocaleString('pt-PT',{timeZone:'Europe/Lisbon',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
  function lock(){
    app.querySelectorAll('input,select,button').forEach(function(e){e.disabled=true;e.tabIndex=-1});
    var lede=app.querySelector('header .lede');
    if(lede&&!app.querySelector('.ro')){var d=document.createElement('div');d.className='ro';
      var u=window.PLANO.data.updatedAt;
      d.innerHTML='<b>Versão só de leitura</b><span>'+(u?'Última alteração: '+when(u)+'.':'')+'</span>';lede.after(d)}
  }
  window.PLANO={readOnly:true,message:'Só leitura'};
  fetch('data.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(d){
      window.PLANO.data=d;
      var s=document.createElement('script');s.src='app.js?t='+Date.now();
      s.onload=function(){lock();new MutationObserver(lock).observe(app,{childList:true})};
      document.body.appendChild(s);
    })
    .catch(function(){app.innerHTML='<p class="msg">Não foi possível carregar o plano. Recarregue a página dentro de alguns segundos.</p>'});
})();
</script>
</body>
</html>
